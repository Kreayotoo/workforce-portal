<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decision Support — Amaravati</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--bg:#060f1c;--pan:#0c1a2e;--pan2:#0e2138;--line:#1d3a57;--ink:#eaf2f9;--dim:#9bb1c6;--teal:#5fe0d2;--cy:#19C6F0;--amber:#f5c542;--red:#ff5d5d;--grn:#57d98a;--vio:#a98bff;--mono:ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,Arial,sans-serif;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:linear-gradient(180deg,#081b30,#07162a);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top img{height:30px}
.tt b{font-size:13.5px;font-weight:800;color:#fff;display:block;line-height:1.1}
.tt span{font-size:9px;color:var(--teal);letter-spacing:.12em;text-transform:uppercase}
.scn{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--pan2);border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.chip:hover{border-color:var(--teal)}.chip.on{border-color:var(--teal);background:#0e2c44;color:var(--teal)}
.main{display:grid;grid-template-columns:1fr 430px;height:calc(100vh - 47px);min-height:0}
.mapwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 11px;background:var(--pan);border-bottom:1px solid var(--line);flex-shrink:0}
.mapcols{flex:1;display:flex;min-height:0;min-width:0}
#map{flex:1;min-width:0;height:100%;background:#0a1626}
.mc{background:var(--pan2);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:5px 10px;font-size:10.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.mc:hover{border-color:var(--teal)}.mc.on{border-color:var(--teal);color:var(--teal);background:#0e2c44}
.mc select{background:transparent;border:0;color:var(--teal);font-family:inherit;font-size:10.5px;outline:none;cursor:pointer}
.mc select option{background:#0c1a2e}
.tsep{width:1px;height:17px;background:var(--line);margin:0 3px}
.hint{margin-left:auto;font-size:10px;color:var(--dim);font-family:var(--mono);white-space:nowrap}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.hd{padding:11px 13px;border-bottom:1px solid var(--line);background:var(--pan)}
.hd .loc{display:flex;align-items:center;gap:10px}
.hd .loc .ic{width:34px;height:34px;border-radius:9px;background:var(--pan2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px}
.hd .loc b{font-size:13px;color:#fff;display:block}
.hd .loc span{font-size:10px;color:var(--dim);font-family:var(--mono)}
.hd .gg{margin-left:auto;text-align:center}
.hd .gg svg{width:56px;height:56px;display:block}
.rad{display:flex;align-items:center;gap:8px;margin-top:9px}
.rad input{flex:1;accent-color:var(--teal)}
.rad label{font-size:10px;color:var(--dim);font-family:var(--mono)}
.rad b{font-family:var(--mono);font-size:11px;color:var(--cy);min-width:50px;text-align:right}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--pan)}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
.tab:hover{color:var(--ink)}.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.body{flex:1;overflow-y:auto;padding:13px}
.sh{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.sh b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);font-family:var(--mono)}
.sh .ln{flex:1;height:1px;background:var(--line)}
.sh .tg{font-size:8.5px;font-family:var(--mono);padding:2px 6px;border-radius:20px}
.tg.real{background:rgba(87,217,138,.14);color:var(--grn);border:1px solid rgba(87,217,138,.4)}
.tg.sim{background:rgba(245,197,66,.12);color:var(--amber);border:1px solid rgba(245,197,66,.4)}
.sec{margin-bottom:17px}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kg.k3{grid-template-columns:1fr 1fr 1fr}
.k{background:var(--pan);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.k .l{font-size:8.5px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;font-family:var(--mono)}
.k .v{font-size:19px;font-weight:800;color:#fff;margin-top:2px;line-height:1.05}
.k .v small{font-size:10px;color:var(--dim);font-weight:600}
.k .s{font-size:9.5px;color:var(--dim);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:11px}
th,td{text-align:right;padding:5px 7px;border-bottom:1px solid rgba(29,58,87,.45)}
th{font-family:var(--mono);font-size:8.5px;color:var(--teal);text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
td b{font-family:var(--mono);font-size:10.5px}
.zrow td:first-child{display:flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.dc{background:var(--pan);border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:10px 12px;margin-bottom:7px}
.dc .h{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.dc .h b{font-size:12px;color:#fff;flex:1}
.dc .cf{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:20px;background:rgba(95,224,210,.12);color:var(--teal)}
.dc .why{font-size:10.8px;color:var(--dim);line-height:1.45}
.dc .act{margin-top:6px;font-size:11px;color:var(--teal);font-weight:600}
.dc .win{font-size:9px;font-family:var(--mono);color:var(--amber);margin-top:3px}
.ck{display:flex;align-items:flex-start;gap:8px;background:var(--pan);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:6px;cursor:pointer}
.ck input{margin-top:2px;accent-color:var(--grn)}
.ck .t{font-size:11.5px;color:var(--ink);font-weight:600}
.ck .m{font-size:9.5px;color:var(--dim);font-family:var(--mono);margin-top:2px}
.ck.done .t{text-decoration:line-through;color:var(--dim)}
.prog{height:6px;background:#12233a;border-radius:6px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--grn);transition:width .3s}
.fac{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.fac div{display:flex;align-items:center;gap:7px;background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:10.5px}
.fac b{color:var(--amber);font-family:var(--mono)}
.fac span{margin-left:auto;color:var(--dim);font-family:var(--mono);font-size:9.5px}
.ms{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-left:2px solid var(--line);margin-left:6px;padding-left:12px;position:relative}
.ms::before{content:'';position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--teal)}
.ms.r::before{background:var(--red)}.ms.a::before{background:var(--amber)}.ms.g::before{background:var(--grn)}
.ms .tm{font-family:var(--mono);font-size:10px;color:var(--cy);min-width:54px}
.ms .tx b{font-size:11.5px;color:#fff;display:block}
.ms .tx span{font-size:10px;color:var(--dim)}
.btn{background:var(--pan2);border:1px solid var(--line);color:var(--teal);border-radius:8px;padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;width:100%}
.btn:hover{border-color:var(--teal)}
.empty{color:var(--dim);font-size:12px;background:var(--pan);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(3,8,16,.85);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--pan);border:1px solid var(--teal);border-radius:14px;padding:16px;width:min(680px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal textarea{flex:1;min-height:340px;background:#06121f;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:var(--mono);font-size:10.5px;padding:11px;resize:none}
.modal .r{display:flex;gap:8px;margin-top:10px}
details{background:var(--pan);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:9px}
summary{cursor:pointer;font-size:10.5px;color:var(--teal);font-family:var(--mono)}
details .c{font-size:10.5px;color:var(--dim);line-height:1.55;margin-top:7px}
.leaflet-container{background:#0a1626}
.bell{display:inline-flex;align-items:center;gap:6px;background:var(--pan2);border:1px solid var(--line);color:var(--amber);border-radius:8px;padding:6px 11px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.bell:hover{border-color:var(--amber)}
.bell .bd{background:var(--red);color:#fff;border-radius:20px;font-size:9px;padding:1px 6px;font-family:var(--mono);line-height:1.5}
.alerts{width:290px;flex-shrink:0;border-right:1px solid var(--line);background:var(--pan);overflow-y:auto;padding:9px;display:none}
.alerts.on{display:block}
.alerts .ah{display:flex;align-items:center;gap:7px;padding:2px 4px 9px;border-bottom:1px solid var(--line);margin-bottom:8px}
.alerts .ah b{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--teal);font-family:var(--mono);flex:1}
.alerts .ah .x{color:var(--dim);cursor:pointer;font-size:16px;line-height:1}
.al{display:flex;gap:8px;background:var(--pan);border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:9px 10px;margin-bottom:6px;cursor:pointer;transition:.12s}
.al:hover{border-color:var(--teal);transform:translateX(2px)}
.al.act{border-color:var(--teal);background:#0e2c44}
.al .ai{font-size:15px;line-height:1}
.al .ac{flex:1;min-width:0}
.al .at{font-size:11.5px;font-weight:700;color:#fff;line-height:1.25}
.al .am{font-size:9.5px;color:var(--dim);font-family:var(--mono);margin-top:2px;line-height:1.4}
.al .src{display:inline-block;font-size:8px;font-family:var(--mono);padding:1px 5px;border-radius:20px;margin-top:4px}
.src.live{background:rgba(87,217,138,.16);color:var(--grn)}
.src.sim{background:rgba(245,197,66,.14);color:var(--amber)}
.abar{background:linear-gradient(90deg,rgba(255,93,93,.16),transparent);border:1px solid var(--red);border-radius:9px;padding:7px 10px;margin-bottom:11px;font-size:10.5px;color:var(--ink);display:flex;align-items:center;gap:7px}
.abar b{color:var(--red);font-family:var(--mono);font-size:9.5px}
.abar .x{margin-left:auto;color:var(--dim);cursor:pointer}
.np{background:var(--red);color:#fff;font-size:8px;font-family:var(--mono);padding:1px 5px;border-radius:20px;vertical-align:middle}
.ackb{background:var(--pan2);border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:3px 7px;font-size:9px;font-weight:700;cursor:pointer;font-family:var(--mono);align-self:flex-start}
.ackb:hover{border-color:var(--grn);color:var(--grn)}
.afl{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);padding:3px 4px 9px;cursor:pointer}
.afl input{accent-color:var(--teal)}
.afl b{color:var(--red)}
#toasts{position:fixed;right:446px;bottom:16px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:320px}
.toast{display:flex;gap:9px;align-items:flex-start;background:rgba(9,20,34,.97);border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:10px 12px;cursor:pointer;animation:sl .25s ease}
.toast:hover{border-color:var(--teal)}
.toast .ti{font-size:16px}
.toast b{font-size:11px;color:#fff;display:block}
.toast span{font-size:10.5px;color:var(--dim);line-height:1.35}
.toast .tx{margin-left:auto;color:var(--dim);font-size:15px;line-height:1}
@keyframes sl{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.lg{display:grid;grid-template-columns:62px 74px 1fr;gap:7px;padding:6px 0;border-bottom:1px solid rgba(29,58,87,.45);font-size:10.5px;align-items:baseline}
.lg .t{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.lg .e{font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:20px;text-align:center}
.lg .d{color:#cfe0f0;line-height:1.4}
.sn{display:grid;grid-template-columns:1fr auto;gap:4px 9px;background:var(--pan);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:6px}
.sn .si b{font-size:11px;color:#fff;font-family:var(--mono)}
.sn .si span{display:block;font-size:9.5px;color:var(--dim)}
.sn .sv{font-size:15px;font-weight:800;font-family:var(--mono);text-align:right}
.sn .sv small{font-size:9px;color:var(--dim);font-weight:600}
.sn .sb{grid-column:1/-1;height:4px;background:#12233a;border-radius:4px;overflow:hidden}
.sn .sb i{display:block;height:100%;border-radius:4px;transition:width .4s}
@media(max-width:900px){
 .main{grid-template-columns:1fr;grid-template-rows:46vh 1fr}
 .side{border-left:0;border-top:1px solid var(--line)}
 .alerts{position:absolute;left:0;top:0;bottom:0;width:min(300px,86%);z-index:800;border-right:1px solid var(--teal);box-shadow:6px 0 22px rgba(0,0,0,.5)}
 .mapcols{position:relative}
 #toasts{right:12px;left:12px;bottom:12px;max-width:none}
 .hint{display:none}
}
</style></head>
<body>
<div class="top">
  <img src="__LOGO__" alt="Kreayotoo">
  <div class="tt"><b>Decision Support &amp; Impact Simulation</b><span>Amaravati · alert-driven · GIS buffer + rule engine</span></div>
  <button class="bell" id="bell">🔔 Alerts <span class="bd" id="bdg">0</span></button>
  <div class="scn" id="scn"></div>
</div>
<div class="main">
  <div class="mapwrap">
    <div class="toolbar">
      <button class="mc on" id="mLU">Landuse</button>
      <button class="mc on" id="mNet">Network</button>
      <button class="mc on" id="mPlots">Affected plots</button>
      <span class="tsep"></span>
      <span class="mc"><select id="jump"></select></span>
      <button class="mc" id="mRand">⚡ Random incident</button>
      <span class="hint" id="hint">Tap the map, or open an alert</span>
    </div>
    <div class="mapcols">
      <div class="alerts on" id="alerts"></div>
      <div id="map"></div>
    </div>
  </div>
  <div class="side">
    <div class="hd" id="hd"></div>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="body"></div>
  </div>
</div>
<div id="toasts"></div>
<div class="modal" id="modal"><div class="box">
  <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:9px">Incident report</div>
  <textarea id="rep" readonly></textarea>
  <div class="r"><button class="btn" id="cpy">Copy to clipboard</button><button class="btn" id="cls">Close</button></div>
</div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
<script>
const PLOTS=__PLOTS__, NET=__NET__, BLOCKS=__BLOCKS__, ZONESTORM=__ZONESTORM__, LANDUSE="__LANDUSE__", LANDUSE_BOUNDS=__LANDUSE_BOUNDS__;

/* ══════════════════════════════════════════════════════════════════════
   LIVE ALERT FEED
   Set ALERT_FEED_URL to your SCADA / MQTT bridge endpoint to go fully live.
   It must return JSON: [ { id, type, severity, lat, lon, ts, source, msg,
                            value, unit, radius } , … ]
     type     : burst | pressure | quality | power | flood | fire
     severity : critical | high | medium
   While the URL is empty the twin builds its own feed:
     • rainfall/storm alerts  → REAL, live from Open-Meteo + your drain capacity
     • burst/pressure/quality → SIMULATED placeholders (labelled ◐)
   ══════════════════════════════════════════════════════════════════════ */
const ALERT_FEED_URL = "";
const POLL_SEC = 20;                      // sensors tick + feed re-checked this often
let ALERTS=[], respondingTo=null, prevIds={}, ackd={}, LOG=[], autoFollow=true, lastPoll=null;
const TYPE2SCEN={burst:'burst',quality:'contam',power:'power',flood:'flood',fire:'fire',pressure:'burst'};
const TYPEICON={burst:'💧',pressure:'📉',quality:'☣️',power:'⚡',flood:'🌊',fire:'🔥'};
const SEVCOL={critical:'#ff5d5d',high:'#f5c542',medium:'#19C6F0'};
function logIt(ev,detail,id){ LOG.unshift({ts:new Date(),ev:ev,detail:detail,id:id||''});
  if(LOG.length>300) LOG.pop(); }
function toast(a){
  const c=document.getElementById('toasts');
  const d=document.createElement('div'); d.className='toast';
  d.style.borderLeftColor=SEVCOL[a.severity];
  d.innerHTML='<div class="ti">'+(TYPEICON[a.type]||'⚠️')+'</div><div><b>New '+a.severity.toUpperCase()+' alert</b>'+
    '<span>'+a.msg+'</span></div><div class="tx">×</div>';
  d.onclick=function(){ respond(a); d.remove(); };
  d.querySelector('.tx').onclick=function(e){ e.stopPropagation(); d.remove(); };
  c.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.remove(); }, 12000);
}
const LAT0=PLOTS.origin[0], LON0=PLOTS.origin[1], FWD=PLOTS.fwd, INV=PLOTS.inv;
const ZN=PLOTS.zones, ZC=PLOTS.colors, UT=NET.utils;
const UCOL={water:'#19C6F0',sewer:'#c98a4b',strom:'#8f7bff',reuse:'#3ecf8e',power:'#ffcf4d'};
const ULAB={water:'Water',sewer:'Sewer',strom:'Storm',reuse:'Reuse',power:'Power'};
const LPCD=135, HHSZ=4.2;
const DENS={'R1-Village planning zone':120,'R3-Medium to high density zone':250,'R4-High density zone':400,
 'R5-Affordable / EWS Housing Zone':350,'SR2 Low Density Housing':60,'SR4 - High Density Private':300,
 'C1 -Mixed use zone':150,'C2- General commercial zone':80,'C3-Neighbourhood centre zone':100,
 'C4-Town centre zone':90,'C5-Regional centre zone':70,'C6-Central business district zone':120,
 'SC1a-Mixed Use':160,'SC1b - Mixed Use':160,'I1-Business park zone':40,'I2-Logistics zone':25,
 'I3-Non polluting industry zone':30,'S2-Education zone':150,'SS2a- Education Zone':150,
 'SS2c Health Zone':100,'SS1 - Government Zone':90,'SS2b Cultural Zone':60,'S3-Special zone':60,
 'SS3 - Special Zone':60,'P1-Passive zone':2,'P2-Active zone':3,'P3-Protected zone':1,
 'P3-Protected zone Hills':0,'SP1- Passive Zone':2,'SP2- Active Zone':3,'SP3-Protected Zone':1,
 'U1-Reserve zone':0,'U2- Road reserve zone':0,'SU1-Reserve Zone':0,'SU2 - Road Network':0};
function dens(z){ return DENS[z]!==undefined?DENS[z]:50; }
function facType(z){ const s=z.toLowerCase();
  if(s.indexOf('education')>=0) return 'Schools / colleges';
  if(s.indexOf('health')>=0) return 'Hospitals / clinics';
  if(s.indexOf('government')>=0) return 'Government offices';
  if(s.indexOf('cultural')>=0) return 'Cultural facilities';
  return null; }
function isRoad(z){ return z.toLowerCase().indexOf('road')>=0; }

const SCEN=[{k:'burst',n:'Pipe Burst',i:'💧',u:'water',r:250},
 {k:'contam',n:'Contamination',i:'☣️',u:'water',r:400},
 {k:'power',n:'Power Failure',i:'⚡',u:'power',r:600},
 {k:'flood',n:'Heavy Rain',i:'🌊',u:'strom',r:350},
 {k:'fire',n:'Fire',i:'🔥',u:'water',r:200}];
let scen=SCEN[0], radius=scen.r, inc=null, tab='impact', A=null, done={};
function fmt(x,d){ return Number(x).toLocaleString(undefined,{maximumFractionDigits:(d===undefined?0:d)}); }
function m2ll(mx,my){ return [LAT0+FWD[2]*mx+FWD[3]*my, LON0+FWD[0]*mx+FWD[1]*my]; }
function ll2m(lat,lon){ const dl=lon-LON0, da=lat-LAT0; return [INV[0]*dl+INV[1]*da, INV[2]*dl+INV[3]*da]; }

const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([16.5019,80.4969],14);
L.control.zoom({position:'topright'}).addTo(map);          // keeps the top-left clear
function resizeMap(){ setTimeout(function(){ map.invalidateSize(); }, 210); }
L.esri.basemapLayer('Imagery').addTo(map);
map.createPane('lu'); map.getPane('lu').style.zIndex=250; map.getPane('lu').style.pointerEvents='none';
let luL=null;
if(LANDUSE){ luL=L.imageOverlay(LANDUSE,LANDUSE_BOUNDS,{pane:'lu',opacity:.5,interactive:false}).addTo(map); }
const netLayer=L.layerGroup().addTo(map), plotLayer=L.layerGroup().addTo(map),

function analyse(mx,my,rad){

    if(!byZone[z]) byZone[z]={n:0,a:0,c:ZC[Z[i]],pop:0};
    byZone[z].n++; byZone[z].a+=a; byZone[z].pop+=p;
    plots++; areaTot+=a; pop+=p;

    const ft=facType(z);

  const hit=[];

}

function drawChart(){
  const T=timeline(A), W=400,H=190,pad=26, steps=48;
  function xs(k){ return pad+k/steps*(W-2*pad); }
  let out='', leg='';
  T.series.forEach(function(s){
    const vals=[]; for(let k=0;k<=steps;k++) vals.push(s.f(k/steps*T.span));
    const mx=Math.max.apply(null,vals.concat([1]))*1.1;
    const p=vals.map(function(v,k){ return (k?'L':'M')+xs(k).toFixed(1)+' '+(H-pad-(v/mx)*(H-2*pad)).toFixed(1); }).join(' ');
    out+='<path d="'+p+'" fill="none" stroke="'+s.c+'" stroke-width="2"/>';
    leg+='<span style="color:'+s.c+'">■ '+s.n+' (peak '+fmt(Math.max.apply(null,vals),1)+')</span>';
  });
  let ticks=''; for(let k=0;k<=4;k++){ const t=k/4*T.span;
    ticks+='<text x="'+xs(k/4*steps)+'" y="'+(H-7)+'" fill="#7f97ad" font-size="9" text-anchor="middle" font-family="ui-monospace">'+fmt(t,1)+(T.unit==='hours'?'h':'m')+'</text>'; }
  document.getElementById('chart').innerHTML='<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#1d3a57"/>'+out+ticks;
  document.getElementById('leg').innerHTML=leg;
}

  const t='Z'+b.zone+'-'+b.block;
  SENSORS.push({id:'PT-'+t, kind:'pressure', unit:'bar',  b:b, base:2.9+seed(b.code+'p')*0.7});
  SENSORS.push({id:'FM-'+t, kind:'flow',     unit:'L/s',  b:b, base:18+seed(b.code+'f')*46});
  if(i%2===0) SENSORS.push({id:'CL-'+t, kind:'chlorine', unit:'mg/L', b:b, base:0.42+seed(b.code+'c')*0.26});
  if(i%4===0) SENSORS.push({id:'PU-'+t, kind:'pump',     unit:'kW',   b:b, base:140+seed(b.code+'u')*130});
});
const FKIND={pressure:'burst', flow:'pressure', chlorine:'quality', pump:'power'};
function spawnFault(now){
  const cand=SENSORS.filter(function(s){ return !FAULTS.some(function(f){return f.sid===s.id;}); });
  if(!cand.length) return;
  const sn=cand[Math.floor(Math.random()*cand.length)];
  FAULTS.push({sid:sn.id, kind:sn.kind, t0:now,
    ramp: 2+Math.random()*6,                       // minutes to reach full severity
    dur: 8+Math.random()*26,                       // minutes before it clears
    mag: 0.55+Math.random()*0.42});                // how bad it gets
}
function tickSim(){
  const now=Date.now();
  FAULTS=FAULTS.filter(function(f){ return (now-f.t0)/60000 < f.dur; });   // resolved
  const elapsed=(now-simT0)/1000;
  if(FAULTS.length<4 && (Math.random() < (elapsed<5 ? 0.9 : 0.16))) spawnFault(now);  // seed fast, then drift
  lastTick=new Date();
}
function readSensor(sn){
  const now=new Date(), hr=now.getHours()+now.getMinutes()/60;
  const d=DIU[Math.floor(hr)%24];
  const nz=(Math.random()-0.5);
  let v;
  if(sn.kind==='pressure') v=sn.base*(1.08-0.10*d)+nz*0.06;
  else if(sn.kind==='flow') v=sn.base*d+nz*sn.base*0.05;
  else if(sn.kind==='chlorine') v=sn.base+nz*0.03;
  else v=sn.base*(0.85+0.20*d)+nz*4;
  const f=FAULTS.filter(function(x){return x.sid===sn.id;})[0];
  let prog=0;
  if(f){ prog=Math.min(1,(Date.now()-f.t0)/60000/f.ramp);
    if(sn.kind==='pressure') v=v*(1-0.62*f.mag*prog);
    else if(sn.kind==='flow') v=v*(1+1.25*f.mag*prog);
    else if(sn.kind==='chlorine') v=Math.max(0.03, v*(1-0.80*f.mag*prog));
    else v=v*(1-f.mag*prog);
  }
  return {v:v, fault:f?prog:0, base:sn.base};
}
function sensorAlert(sn){
  const r=readSensor(sn); sn.last=r.v; sn.prog=r.fault;
  if(!r.fault) return null;
  const b=sn.b; let type,sev,msg,val,unit;
  if(sn.kind==='pressure'){
    const drop=(1-r.v/(sn.base*1.0))*100;
    if(r.v>2.35) return null;
    type='burst'; sev=r.v<1.5?'critical':(r.v<1.95?'high':'medium');
    msg='Pressure '+Math.round(drop)+'% below normal — suspected burst (Zone '+b.zone+' · '+b.block+')';
    val=r.v.toFixed(2); unit='bar (normal '+sn.base.toFixed(1)+')';
  } else if(sn.kind==='flow'){
    const up=(r.v/sn.base-1)*100;
    if(up<45) return null;
    type='pressure'; sev=up>110?'critical':(up>75?'high':'medium');
    msg='Flow up '+Math.round(up)+'% at the DMA inlet — probable leak (Zone '+b.zone+' · '+b.block+')';
    val='+'+Math.round(up); unit='% vs baseline ('+r.v.toFixed(0)+' L/s)';
  } else if(sn.kind==='chlorine'){
    if(r.v>=0.20) return null;
    type='quality'; sev=r.v<0.08?'critical':(r.v<0.14?'high':'medium');
    msg='Chlorine residual below limit (Zone '+b.zone+' · '+b.block+')';
    val=r.v.toFixed(2); unit='mg/L (min 0.20)';
  } else {
    if(r.v>sn.base*0.35) return null;
    type='power'; sev=r.v<8?'critical':'high';
    msg='Pump station drawing '+r.v.toFixed(0)+' kW — supply fault (Zone '+b.zone+' · '+b.block+')';
    val=r.v.toFixed(0); unit='kW (normal '+sn.base.toFixed(0)+')';
  }
  const f=FAULTS.filter(function(x){return x.sid===sn.id;})[0];
  return {id:'SEN-'+sn.id, type:type, live:false, severity:sev,
    lat:b.lat+(seed(sn.id+'a')-0.5)*0.004, lon:b.lon+(seed(sn.id+'b')-0.5)*0.004,
    radius:type==='power'?600:(type==='quality'?400:250),
    ts:new Date(f?f.t0:Date.now()).toISOString(),
    source:'Demo sensor '+sn.id+' — SCADA placeholder',
    msg:msg, value:val, unit:unit};
}

async function loadAlerts(){
  // 1 ── real SCADA feed, if configured
  if(ALERT_FEED_URL){
    try{ const r=await fetch(ALERT_FEED_URL); const j=await r.json();
      applyFeed(j.map(function(a){ a.live=true; return a; })); return;
    }catch(e){ /* fall through to the built-in feed */ }
  }
  const out=[];
  // 2 ── LIVE rainfall → storm/flood alerts (real: Open-Meteo + your Manning drain capacity)
  try{
    if(!WX || Date.now()-WXT > 10*60*1000){
      const u='https://api.open-meteo.com/v1/forecast?latitude='+NLAT+'&longitude='+NLON+
              '&hourly=precipitation&past_days=2&forecast_days=2&timezone=auto';
      WX=await (await fetch(u)).json(); WXT=Date.now();
    }
    const d=WX;
    const H=d.hourly, now=new Date();
    let i0=H.time.findIndex(function(t){ return new Date(t)>=now; }); if(i0<1) i0=1;
    let ante=0; for(let i=Math.max(0,i0-48);i<i0;i++) ante+=H.precipitation[i]||0;
    const nxt=[]; for(let i=i0;i<i0+24&&i<H.time.length;i++) nxt.push(H.precipitation[i]||0);
    const peak1=Math.max.apply(null,nxt.concat([0]));
    let peak3=0; for(let i=0;i+3<=nxt.length;i++){ const s=(nxt[i]+nxt[i+1]+nxt[i+2])/3; if(s>peak3) peak3=s; }
    const iPk=Math.max(peak1,peak3), C=Math.min(0.95,0.70+Math.min(ante/60,1)*0.22);
    if(iPk>0.4){
      Object.keys(ZONESTORM).forEach(function(z){
        const s=ZONESTORM[z], A=Math.max(s.area_m2,50000), Qcap=Math.max(0.02,s.capacity_m3s||0.1);
        const util=Math.min(200, C*iPk*A/3.6e6/Qcap*100);
        if(util<50) return;
        const b=zoneBlock(z);
        out.push({id:'WX-'+z, type:'flood', live:true,
          severity: util>100?'critical':(util>70?'high':'medium'),
          lat:b.lat, lon:b.lon, radius:400, ts:new Date().toISOString(),
          source:'Open-Meteo (live rainfall)',
          msg:'Zone '+z+' storm drains at '+Math.round(util)+'% capacity',
          value:iPk.toFixed(1), unit:'mm/hr peak · '+ante.toFixed(0)+' mm antecedent'});
      });
    }
  }catch(e){ /* offline — no live weather alerts */ }
  // 3 ── DEMO SENSOR NETWORK (◐ SIM) — virtual sensors that actually move.
  //      Values evolve every tick (diurnal pattern + noise); faults appear, escalate and clear.
  //      Alerts below are DERIVED FROM THE SENSOR READINGS crossing thresholds — exactly how
  //      SCADA alerting works. Set SENSOR_FEED_URL / ALERT_FEED_URL to swap in the real thing.
  tickSim();
  SENSORS.forEach(function(sn){
    const a=sensorAlert(sn); if(a) out.push(a);
  });
  const rank={critical:0,high:1,medium:2};
  out.sort(function(a,b){ return (rank[a.severity]-rank[b.severity]) || (a.live===b.live?0:(a.live?-1:1)); });
  applyFeed(out);
}

/* ---- diff the feed: new / changed / resolved → keep the decision view live ---- */
function applyFeed(out){
  const first = lastPoll===null;
  const nowIds={}; const fresh=[];
  out.forEach(function(a){ nowIds[a.id]=a;
    if(!prevIds[a.id]){ a.isNew=!first; if(!first) fresh.push(a); logIt('received', a.msg, a.id); }
    else { a.isNew=false;
      const p=prevIds[a.id];
      if(p.severity!==a.severity){ a.isNew=!first; logIt('escalated', a.msg+' ('+p.severity+' → '+a.severity+')', a.id); if(!first) fresh.push(a); }
    }
  });
  // resolved = was there, now gone
  Object.keys(prevIds).forEach(function(id){
    if(!nowIds[id]){ logIt('resolved', prevIds[id].msg, id);
      for(var rk in RUNS){ if(rk.indexOf(id+'|')===0) delete RUNS[rk]; }
      if(respondingTo && respondingTo.id===id){ respondingTo.resolved=true; }
    }
  });
  ALERTS=out; prevIds=nowIds; lastPoll=new Date();
  renderAlerts();

  // 1) the alert we are working on may have changed → re-run its analysis with the new numbers
  if(respondingTo && !respondingTo.resolved && nowIds[respondingTo.id]){
    const upd=nowIds[respondingTo.id];
    const changed = upd.severity!==respondingTo.severity;
    respondingTo=upd;
    if(changed){ logIt('re-analysed', 'Alert updated → impact recalculated', upd.id); respond(upd, true); }
    else if(inc){ drawSuspectRun(respondingTo); setIncident(inc[0], inc[1]); }   // refresh run + risk/actions
  } else if(respondingTo && respondingTo.resolved && inc){
    renderAll(inc[0], inc[1]);
  }
  // 2) new alerts → notify; auto-follow the worst new CRITICAL one
  fresh.forEach(function(a){ toast(a); });
  const crit=fresh.filter(function(a){ return a.severity==='critical'; });
  if(autoFollow && crit.length && (!respondingTo || respondingTo.resolved || respondingTo.severity!=='critical')){
    logIt('auto-analysed', 'Auto-follow picked up a new CRITICAL alert', crit[0].id);
    respond(crit[0]);
  }
}
function ago(ts){ const m=Math.round((Date.now()-new Date(ts).getTime())/60000);
  return m<1?'just now':(m<60?m+' min ago':Math.round(m/60)+' hr ago'); }
function renderAlerts(){
  const live=ALERTS.filter(function(a){return a.live;}).length;
  const crit=ALERTS.filter(function(a){return a.severity==='critical';}).length;
  const bd=document.getElementById('bdg');
  bd.textContent=ALERTS.length; bd.style.background=crit?'#ff5d5d':'#f5c542'; bd.style.color=crit?'#fff':'#06121f';
  document.getElementById('alerts').innerHTML=
    '<div class="ah"><b>Alert feed</b>'+
    '<span style="font-size:9px;font-family:var(--mono);color:var(--grn)">'+live+' live</span>'+
    '<span style="font-size:9px;font-family:var(--mono);color:var(--amber)">'+(ALERTS.length-live)+' sim</span>'+
    '<span class="x" id="aX">×</span></div>'+
    '<label class="afl"><input type="checkbox" id="afTog"'+(autoFollow?' checked':'')+
    '> auto-analyse new <b>critical</b> alerts</label>'+
    (ALERTS.length?ALERTS.map(function(a){
      const st=a.resolved?'resolved':(respondingTo&&respondingTo.id===a.id?'responding':(ackd[a.id]?'acknowledged':'new'));
      return '<div class="al '+(respondingTo&&respondingTo.id===a.id?'act':'')+'" data-id="'+a.id+'" style="border-left-color:'+SEVCOL[a.severity]+'">'+
        '<div class="ai">'+(TYPEICON[a.type]||'⚠️')+'</div>'+
        '<div class="ac"><div class="at">'+a.msg+(a.isNew?' <span class="np">NEW</span>':'')+'</div>'+
        '<div class="am">'+a.value+' '+a.unit+' · '+ago(a.ts)+' · <b style="color:'+SEVCOL[a.severity]+'">'+a.severity.toUpperCase()+'</b></div>'+
        '<span class="src '+(a.live?'live':'sim')+'">'+(a.live?'● LIVE — '+a.source:'◐ SIM — '+a.source)+'</span>'+
        (st==='acknowledged'?'<span class="src" style="background:rgba(155,177,198,.15);color:var(--dim)">✓ acknowledged</span>':'')+
        (st==='responding'?'<span class="src" style="background:rgba(95,224,210,.15);color:var(--teal)">▶ analysing</span>':'')+
        '</div>'+
        (ackd[a.id]?'':'<button class="ackb" data-ack="'+a.id+'">ACK</button>')+
        '</div>';
    }).join('')
     :'<div style="font-size:11px;color:var(--dim);padding:8px;line-height:1.5">No alerts. Live rainfall is below the storm threshold — nothing to act on.</div>')+
    '<div style="font-size:9px;color:#6d829a;font-family:var(--mono);margin-top:8px;line-height:1.5;border-top:1px solid var(--line);padding-top:8px">'+
    'Feed re-checked every '+POLL_SEC+'s · last '+(lastPoll?lastPoll.toLocaleTimeString():'—')+'<br>'+
    'Flood alerts are <b style="color:var(--grn)">live</b> (Open-Meteo rainfall vs your real drain capacity).<br>'+
    'Burst/pressure/quality are <b style="color:var(--amber)">placeholders</b> until SCADA is connected — set <b>ALERT_FEED_URL</b>.</div>';
  document.getElementById('aX').onclick=function(){ document.getElementById('alerts').classList.remove('on'); resizeMap(); };
  document.getElementById('afTog').onchange=function(e){ autoFollow=e.target.checked;
    logIt('setting', 'Auto-follow '+(autoFollow?'enabled':'disabled'), ''); };
  document.querySelectorAll('.ackb').forEach(function(b){ b.onclick=function(e){ e.stopPropagation();
    const id=b.dataset.ack; ackd[id]=true;
    const a=ALERTS.filter(function(x){return x.id===id;})[0];
    logIt('acknowledged', a?a.msg:'', id); renderAlerts(); }; });
  document.querySelectorAll('.al').forEach(function(el){ el.onclick=function(){
    const a=ALERTS.filter(function(x){return x.id===el.dataset.id;})[0]; if(a) respond(a); }; });
  try{ parent.postMessage({t:'alertCount', n:ALERTS.length, crit:crit, live:live}, '*'); }catch(e){}
}
var RUNS={};
function traceRun(mx,my,util,limitM){
  const ui=UT.indexOf(util); if(ui<0||!NET.pipes.length) return null;
  const BB=1700, cand=[];
  for(let i=0;i<NET.pipes.length;i++){ const p=NET.pipes[i]; if(p[4]!==ui) continue;
    const cx=(p[0]+p[2])/2, cy=(p[1]+p[3])/2;
    if(Math.abs(cx-mx)>BB||Math.abs(cy-my)>BB) continue; cand.push(i); }
  if(!cand.length) return null;
  let seed=-1,bd=1e12;
  cand.forEach(function(i){ const p=NET.pipes[i], cx=(p[0]+p[2])/2, cy=(p[1]+p[3])/2;
    const d=(cx-mx)*(cx-mx)+(cy-my)*(cy-my); if(d<bd){bd=d;seed=i;} });
  if(bd>400*400) return null;
  const key=function(x,y){ return ((x+0.5)|0)+':'+((y+0.5)|0); };
  const nodeMap={};
  cand.forEach(function(i){ const p=NET.pipes[i];
    [key(p[0],p[1]),key(p[2],p[3])].forEach(function(k){ (nodeMap[k]=nodeMap[k]||[]).push(i); }); });
  const seen={}; seen[seed]=1; const queue=[seed]; let qi=0, total=0; const out=[];
  while(qi<queue.length){
    const i=queue[qi++]; out.push(i);
    const p=NET.pipes[i]; total+=Math.hypot(p[2]-p[0],p[3]-p[1]);
    if(total>limitM) break;
    [key(p[0],p[1]),key(p[2],p[3])].forEach(function(k){
      (nodeMap[k]||[]).forEach(function(j){ if(!seen[j]){ seen[j]=1; queue.push(j); } }); });
  }
  return {idx:out, km:total/1000};
}
function getRun(id,mx,my,util){ const k=id+'|'+util;
  if(RUNS[k]&&RUNS[k].mx===mx&&RUNS[k].my===my) return RUNS[k].r;
  const r=traceRun(mx,my,util,2600); RUNS[k]={mx:mx,my:my,r:r}; return r; }
function clearRun(){ runLayer.clearLayers(); window.__run=null; }
function drawSuspectRun(a){
  clearRun();
  const UMAP={burst:'water',pressure:'water',quality:'water',power:'power',fire:'water'};
  const util=UMAP[a.type]; if(!util) return;
  const m=ll2m(a.lat,a.lon);
  const r=getRun(a.id,m[0],m[1],util); if(!r||!r.idx.length) return;
  const cv2=L.canvas({padding:.5});
  let overlap=null, others=0;
  ALERTS.forEach(function(b){ if(b.id===a.id||UMAP[b.type]!==util) return;
    const mb=ll2m(b.lat,b.lon), rb=getRun(b.id,mb[0],mb[1],util); if(!rb) return;
    const set={}; rb.idx.forEach(function(i){ set[i]=1; });
    const inter=r.idx.filter(function(i){ return set[i]; });
    if(inter.length){ others++;
      overlap = overlap ? overlap.filter(function(i){ return inter.indexOf(i)>=0; }) : inter; } });
  r.idx.forEach(function(i){ const p=NET.pipes[i];
    L.polyline([m2ll(p[0],p[1]),m2ll(p[2],p[3])],
      {color:'#ff9f43',weight:3.2,opacity:.9,dashArray:'7 6',renderer:cv2}).addTo(runLayer); });
  let okm=0;
  if(overlap&&overlap.length){ overlap.forEach(function(i){ const p=NET.pipes[i];
      okm+=Math.hypot(p[2]-p[0],p[3]-p[1])/1000;
      L.polyline([m2ll(p[0],p[1]),m2ll(p[2],p[3])],
        {color:'#ffe066',weight:6,opacity:.95,renderer:cv2}).addTo(runLayer); }); }
  window.__run={km:r.km, okm:okm, others:others};
}
function respond(a, quiet){
  respondingTo=a; a.isNew=false;
  drawSuspectRun(a);
  const sk=TYPE2SCEN[a.type]||'burst';
  scen=SCEN.filter(function(s){return s.k===sk;})[0];
  radius=a.radius||scen.r;
  document.querySelectorAll('.chip').forEach(function(x){ x.classList.toggle('on', x.dataset.k===scen.k); });
  if(!quiet) logIt('analysed', 'Impact analysis run for '+a.msg, a.id);
  setIncident(a.lat,a.lon);
  renderAlerts();
}
document.getElementById('bell').onclick=function(){
  document.getElementById('alerts').classList.toggle('on'); resizeMap(); };
loadAlerts();
setInterval(function(){ loadAlerts(); if(tab==='sens'&&inc) renderAll(inc[0],inc[1]); }, POLL_SEC*1000);
</script>
